[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: full pipeline against a throwaway SQLite database (mock LLM, no network)
    oracle: runs against the Oracle database in .env; opt in with CORI_TEST_ORACLE=1 (reseeds the Cori schema)
    llm: calls a real LLM provider; skipped unless its API key is set
filterwarnings =
    ignore::DeprecationWarning
